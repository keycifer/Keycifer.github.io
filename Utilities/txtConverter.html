<!DOCTYPE html>

<html>
    <head>
        <title>Text converter</title>
        <link rel="icon" type="image/x-icon" href="../favicon.png">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
        
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }

            .containerr {
                display: flex;
                gap: 20px;
            }

            .editor, textarea {
                width: 50%;
                min-height: 400px;
                padding: 12px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 16px;
                overflow-y: auto;
            }

            .editor {
                outline: none;
            }

            textarea {
                resize: none;
                font-family: Consolas, monospace;
            }
        </style>
    </head>
    <body>
        <a href="https://keycifer.github.io">Back</a>
        <h1>Text to html converter (v1)</h1>
        <p>Paste text from google docs (or wherever) to the left and copy the generated html code.</p>
        <div class="containerr">

            <div id="editor" class="editor" contenteditable="true">

            </div>

            <textarea id="output" readonly></textarea>

        </div>

        <script>
          const editor = document.getElementById("editor");
          const output = document.getElementById("output");

          editor.addEventListener("input", convert)

          function convert() {
            let html = editor.innerHTML;

            html = html.replace(/<b>/g, "<strong>");
                html = html.replace(/<\/b>/g, "</strong>");

                html = html.replace(/<i>/g, "<em>");
                html = html.replace(/<\/i>/g, "</em>");

                output.value = html;
          }
            
            
            fetch("../sidebar.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("sidebar").innerHTML = data;
    });

fetch("../banner.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("banner").innerHTML = data;
    });
        </script>
    </body>
</html>
