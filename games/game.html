			const params = new URLSearchParams(window.location.search);
			const game = params.get("game");

			if (games[game]) {

				document.getElementById("creatorText").textContent = "Created by " + games[game].creator;
				document.getElementById("gameParam").value = games[game].file;
				document.getElementById("gameEmbed").src = games[game].file;
					
				if (games[game].button) {
					document.getElementById("creatorButton").style.display = "inline-block";
					document.getElementById("creatorButton").href = games[game].button.link;
					document.getElementById("buttonImage").src = games[game].button.image;
				}

					document.getElementById("buttonImage2").src = games[game].button2.image;
				}
			}

			function goFullscreen(id) {

				var element = document.getElementById(id);

				if (element.requestFullscreen) {
					element.requestFullscreen();
				}
				else if (element.webkitRequestFullscreen) {
					element.webkitRequestFullscreen();
				}
				else if (element.mozRequestFullScreen) {
					element.mozRequestFullScreen();
				}
			}
